name: FluentEDI
description: 45 deterministic tools for AI agents, free and with no API key, signup or rate limit. Every
  tool is a single stateless GET or POST returning JSON, read-only and idempotent. Coverage runs deepest
  in retail EDI -- X12 850/856/810/855/997 parsing, generating an 856 with correct HL parent pointers
  and a fixed-width 106-character ISA, envelope validation, decoding a 997 acknowledgment into plain language,
  and GS1 check digits -- alongside timezone and delivery-window arithmetic, cron, exact maths, JSON repair
  with line/column error localisation, JSONPath, RFC 8785 canonical JSON with CIDv1, Ed25519/ECDSA/RSA
  signature verification, secret and PII scanning, link-liveness checking with retraction detection, endpoint
  assertion, and text position conversion.
