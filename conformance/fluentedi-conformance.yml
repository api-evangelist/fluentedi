compliance_note: >-
  No SOC 2, ISO 27001, PCI DSS, HIPAA or FedRAMP attestation is published, and no trust centre
  exists. That is coherent with the service rather than a gap: there is no account, no stored
  content and no customer data - /privacy states nothing sent is stored, logged as content, or used
  for training - so there is no processing relationship for a certification to cover. No Compliance
  pointer is emitted, because none is earned.
