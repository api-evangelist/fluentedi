domain_standards:
- id: x12
  name: ANSI ASC X12 EDI
  conforms: true
  role: implements
  transaction_sets: ['850', '855', '810', '856', '997', '999']
  evidence:
  - location: 'openapi.json $.paths["/v1/edi/build"].post.requestBody.content["application/json"].schema.properties.document.enum = ["856","850"]'
    detail: The contract enumerates the X12 transaction sets it emits as a schema enum, not as prose.
  - location: 'openapi.json $.paths["/v1/edi/acknowledge"].get.parameters[0].description = "Raw 997 or 999 acknowledgment text"'
    detail: The 997/999 Functional Acknowledgment is a first-class input type in the contract.
  - location: 'openapi.json $.paths["/v1/edi/acknowledge"].get.parameters[1].description names ST02 control numbers'
  - location: 'openapi.json $.paths["/v1/edi/validate"].get.parameters[1].description = HL level codes ["S","O","P","I"] for a pack-level ASN'
    detail: The 856 HL hierarchy level codes appear as documented parameter values.
  - location: 'openapi.json $.paths["/v1/edi/build"].post description and requestBody name ISA05, ISA06, ISA07, ISA08, ISA13, ISA15, GS06, ST02, SE01, CTT01, GE01, IEA01'
    detail: >-
      Interchange and functional-group envelope elements are named as individual request parameters
      with their X12 element identifiers and maxLengths (sender_id maxLength 15 = ISA06, qualifiers
      maxLength 2 = ISA05/ISA07), which is a contract-level X12 signature rather than a claim.
  note: >-
    The distinction this check draws applies literally here: a trading partner who already speaks
    X12 850/856/997 integrates against these operations with no bespoke connector, because the
    contract speaks in ISA/GS/ST/HL/SE terms rather than in an invented vocabulary.
