  Four example values in this file and two in openapi/fluentedi-openapi.json were rewritten to
  REDACTED_* placeholders by 0-working/sanitize-secrets.py. They are the provider's own deliberately
  fake demonstration tokens for the secret.scan and url.scan tools - a Stripe-shaped key and a
  GitHub-shaped token, published so a caller can see the scanner fire. They are replaced here only
