  /v1/net/inspect:
    get:
      operationId: net_inspect_get
      summary: Report the caller's IP, geolocation, network and TLS details as seen from the…
      description: 'Returns what a server actually observes about the caller: source IP, country and city, ASN and network operator, the Cloudflare edge location that served the request, HTTP version and TLS cipher. Useful for confirming egress IP, diagnosing a geo-routing problem, or establishing an agent''s own network context.'
      tags:
      - Web
      parameters:
      - name: include_headers
        in: query
        required: false
        description: Echo the request headers back (Authorization and Cookie are redacted).
        schema:
          description: Echo the request headers back (Authorization and Cookie are redacted).
          type: boolean
          default: false
      responses:
        '200':
          description: Tool result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  tool:
                    type: string
                  result:
                    type: object
                    description: Tool-specific result payload.
        '400':
          description: Invalid input. The body carries the parameter schema and working examples.
    post:
      operationId: net_inspect_post
      summary: Report the caller's IP, geolocation, network and TLS details as seen from the…
      description: 'Returns what a server actually observes about the caller: source IP, country and city, ASN and network operator, the Cloudflare edge location that served the request, HTTP version and TLS cipher. Useful for confirming egress IP, diagnosing a geo-routing problem, or establishing an agent''s own network context.'
      tags:
      - Web
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                include_headers:
                  description: Echo the request headers back (Authorization and Cookie are redacted).
                  type: boolean
                  default: false
              required: []
              additionalProperties: false
      responses:
        '200':
          description: Tool result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  tool:
                    type: string
                  result:
                    type: object
                    description: Tool-specific result payload.
        '400':
          description: Invalid input. The body carries the parameter schema and working examples.
  /v1/domain/lookup:
    get:
      operationId: domain_lookup_get
      summary: 'WHOIS for a domain or IP: registration and expiry dates, registrar…'
      description: 'Answers the questions WHOIS used to answer, over RDAP — the structured protocol the registries themselves now serve — with no key and no scraping: who registered a domain, when it expires, which registrar and nameservers it uses, whether transfers are locked, and whether DNSSEC is signed. Give it an IP address instead and it returns the owning network: name, CIDR range, and the responsible registry. A domain that does not resolve in RDAP is reported as likely available to register — an answer, not an error. These are live registry facts that no training corpus can supply: registrations, expiries and transfers happen daily, and an agent that guesses at them guesses wrong.'
      tags:
      - Web
      parameters:
      - name: query
        in: query
        required: true
        description: Domain name or IP address to look up.
        schema:
          description: Domain name or IP address to look up.
          type: string
          maxLength: 253
          examples:
          - example.com
      responses:
        '200':
          description: Tool result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  tool:
                    type: string
                  result:
                    type: object
                    description: Tool-specific result payload.
        '400':
