openapi: 3.2.0
info:
  title: FluentEDI Web API
  version: 1.1.0
  summary: Deterministic tools for AI agents. No key, no signup, no SDK.
  description: 'A public HTTP API of deterministic tools for the work a language model cannot do reliably by reasoning: knowing the current time in any timezone and whether an instant falls inside a window, exact arithmetic, hashing and signature verification, canonicalizing and content-addressing JSON, repairing malformed JSON and pinpointing where it broke, querying and diffing structured data, parsing CSV correctly, converting units, colours and currencies at live ECB rates, testing regular expressions…'
  license:
    name: Free to use
    identifier: MIT
servers:
- url: https://fluentedi.com
tags:
- name: Web
  description: Web and network
paths:
  /v1/url/parse:
    get:
      operationId: url_parse_get
      summary: Parse, normalise or resolve a URL and break out its query parameters
      description: Decomposes a URL into scheme, host, port, path, query and fragment, decodes every query parameter (keeping repeated keys as arrays), and reports whether the host is an IP address or an IDN. Can also resolve a relative reference against a base URL — the operation that quietly breaks scrapers and link-followers when done with string concatenation.
      tags:
      - Web
      parameters:
      - name: url
        in: query
        required: true
        description: URL or relative reference to parse.
        schema:
          description: URL or relative reference to parse.
          type: string
          maxLength: 8000
          examples:
          - https://example.com/a/b?q=hello%20world&tag=x&tag=y#top
      - name: base
        in: query
        required: false
        description: Base URL to resolve a relative reference against.
        schema:
          description: Base URL to resolve a relative reference against.
          type: string
          default: ''
          maxLength: 8000
      - name: strip_tracking
        in: query
        required: false
        description: Also return the URL with utm_* and common click-tracking parameters removed.
        schema:
          description: Also return the URL with utm_* and common click-tracking parameters removed.
          type: boolean
          default: false
      responses:
        '200':
          description: Tool result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  tool:
                    type: string
                  result:
                    type: object
                    description: Tool-specific result payload.
        '400':
          description: Invalid input. The body carries the parameter schema and working examples.
    post:
      operationId: url_parse_post
      summary: Parse, normalise or resolve a URL and break out its query parameters
      description: Decomposes a URL into scheme, host, port, path, query and fragment, decodes every query parameter (keeping repeated keys as arrays), and reports whether the host is an IP address or an IDN. Can also resolve a relative reference against a base URL — the operation that quietly breaks scrapers and link-followers when done with string concatenation.
      tags:
      - Web
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  description: URL or relative reference to parse.
                  type: string
                  maxLength: 8000
                  examples:
                  - https://example.com/a/b?q=hello%20world&tag=x&tag=y#top
                base:
                  description: Base URL to resolve a relative reference against.
                  type: string
                  default: ''
                  maxLength: 8000
                strip_tracking:
                  description: Also return the URL with utm_* and common click-tracking parameters removed.
                  type: boolean
                  default: false
              required:
              - url
              additionalProperties: false
      responses:
        '200':
          description: Tool result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  tool:
                    type: string
                  result:
                    type: object
                    description: Tool-specific result payload.
        '400':
          description: Invalid input. The body carries the parameter schema and working examples.
  /v1/url/scan:
    get:
      operationId: url_scan_get
      summary: Detect credentials, tokens and personal data leaking in a URL, and return a…
      description: 'Scans a URL''s query string, path, fragment and userinfo for secrets and personal data — provider API keys, JWTs, bearer tokens, private keys, high-entropy values in credential-shaped parameters, email addresses, national identifiers and Luhn-valid card numbers. A URL is the least private place to put a secret: it is written to server logs, proxy logs, browser history and Referer headers, none of which are covered by the transport encryption. Returns a redacted URL safe to paste into a log or a ticket.'
      tags:
      - Web
      parameters:
      - name: url
        in: query
        required: true
        description: URL to scan.
        schema:
          description: URL to scan.
          type: string
          maxLength: 8000
          examples:
          - https://api.example.com/v1/items?api_key=REDACTED_STRIPE_KEY&user=ada@example.com
      - name: include_low
        in: query
        required: false
        description: Include low-severity findings such as tracking parameters.
        schema:
          description: Include low-severity findings such as tracking parameters.
          type: boolean
          default: true
      responses:
        '200':
          description: Tool result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  tool:
                    type: string
                  result:
                    type: object
                    description: Tool-specific result payload.
        '400':
          description: Invalid input. The body carries the parameter schema and working examples.
    post:
      operationId: url_scan_post
      summary: Detect credentials, tokens and personal data leaking in a URL, and return a…
      description: 'Scans a URL''s query string, path, fragment and userinfo for secrets and personal data — provider API keys, JWTs, bearer tokens, private keys, high-entropy values in credential-shaped parameters, email addresses, national identifiers and Luhn-valid card numbers. A URL is the least private place to put a secret: it is written to server logs, proxy logs, browser history and Referer headers, none of which are covered by the transport encryption. Returns a redacted URL safe to paste into a log or a ticket.'
      tags:
