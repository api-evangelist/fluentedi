note: >-
  An honest zero with a reason. The provider does not merely omit rate limits - it declares their
  absence twice in machine-readable form: /.well-known/ai carries "rate_limit": "none" and llms.txt
  states "Free and unauthenticated, with no rate limit and no paid tier". A live response was
  inspected and carries no X-RateLimit-*, RateLimit-* or Retry-After header, which is consistent.
  The practical caveat for an agent: because no limit is published and no headers are returned,
  there is also no runtime signal if the edge does throttle - the origin is behind Cloudflare, whose
  own DDoS protection is not part of the provider's declaration. An agent should treat a 429 as
  possible and unannounced rather than impossible.
